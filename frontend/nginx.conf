server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Look `backend` up through Docker's DNS on each request (cached 10s)
    # rather than once at startup. A deploy can recreate the backend alone,
    # giving it a new address, and on the very first deploy there is no live
    # backend for the candidate frontend to resolve at all: a fixed upstream
    # would 502 in the first case and stop nginx starting in the second.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend backend:3001;

    # /api/* goes to the backend with the /api prefix stripped. The deploy's
    # live check asks for /api/health through here.
    location /api/ {
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         http://$backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # What says "a new version is out" must never be served from a cache.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Vite names every asset after its content: keep it for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
