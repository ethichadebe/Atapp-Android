# On every response. Included at the server level and again in each location
# that sets a header of its own, because nginx drops the server's add_header
# lines from any location that has one.
#
# Images are hotlinked from the National Gallery's IIIF server, api.nga.gov;
# nothing else is loaded from anywhere but this site.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://api.nga.gov; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
